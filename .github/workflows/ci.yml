name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'  # minimum patched Node 22 for the eMudhra CA compromise
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-tools
        run: cargo install wasm-tools

      - run: npm ci

      - name: Build wasm + generate model
        run: npm run compile-wasm

      - name: Type check
        run: npm run check-types

      - name: WCP server tests
        run: npm run test:wcp

      - name: Lint
        run: npm run lint

      - name: Bundle (esbuild)
        run: node esbuild.js
